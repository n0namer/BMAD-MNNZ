[metadata]
name = bmad-mnnz
version = 0.1.0

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.11

[options.packages.find]
where = src

[tool:pytest]
testpaths = src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=src/bmad --cov-report=html --cov-report=term-missing --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

[coverage:run]
source = src/bmad
branch = True
omit =
    */tests/*
    */venv/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
fail_under = 90
precision = 2
