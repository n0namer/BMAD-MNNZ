## 2026: YEAR OF FOUNDATION & HEALTH

year_2026:
  theme: "Build passive income foundation + restore health"

  primary_goals:
    - goal_id: "2026-01-passive-income"
      title: "Launch Passive Income Streams"
      description: |
        Establish two passive income sources:
        1) Trading bot (Katana-VectorBT) - automated trading
        2) Profitable SaaS service (Sales QA OR Consilium MVP)

      success_criteria:
        - Trading bot: Running, generating revenue (any amount)
        - SaaS: Beta users or 1st paying customer

      financial_target: "$5,000-15,000/month from passive sources"

      projects:
        - project: "001-katana-vectorbt"
          priority: "🔴 CRITICAL"
          reason: "Foundation for 1млн/месяц goal"
          timeline: "Jan-Mar 2026"
          effort_estimate: "80-120 hours"
          multiplier: "14x (with Claude Code + BMAD + Flow)"
          realistic_duration: "5-9 days focused work"

        - project: "005-sales-qa-saas"
          priority: "🔴 CRITICAL"
          reason: "First SaaS product to validate market"
          timeline: "Apr-May 2026"
          effort_estimate: "200-400 hours"
          multiplier: "18.5x"
          realistic_duration: "11-22 hours = 2-3 days focused"

    - goal_id: "2026-02-health-restoration"
      title: "Restore Health"
      description: |
        Complete three medical procedures:
        1) Eye surgery (SMILE) - restore vision
        2) Tonsillectomy - gland removal
        3) Weight loss with Tirzepatide

      timeline_detail:
        - date: "2026-02-09"
          event: "Тонзиллэктомия: начало анализов у доктора"
          impact: "Start medical preparation"
          workload: "Low"

        - date: "2026-02-19"
          event: "Операция на гландах"
          impact: "Unable to work 2-4 weeks"
          workload: "None"

        - date: "2026-03-01"
          event: "Ранняя реабилитация"
          impact: "50% productivity, light work only"
          duration: "4 weeks"
          workload: "Low"

        - date: "2026-04-01"
          event: "SMILE: восстановление зрения"
          impact: "Schedule after gland recovery"
          workload: "Low during preparation/recovery"

        - date: "2026-06-30"
          event: "DEADLINE: похудеть на Тирзепатиде"
          impact: "Must be on weight loss track by June"
          workload: "Ongoing (weekly weigh-ins)"

      success_criteria:
        - Gland surgery: Successfully completed, healed
        - SMILE: Eyes restored, clear vision
        - Tirzepatide: Target weight achieved by June

      health_targets:
        - vision: "20/20 after SMILE"
        - weight: "Achieve target by June 30"
        - energy: "Higher energy from health improvements"

  quarterly_breakdown:

    Q1_2026:
      focus: "Prepare for surgery + start Katana"
      goals:
        - "Get Katana-VectorBT foundation running"
        - "Complete medical tests and surgery"
        - "Start recovery and light work"
      timeline:
        - "Jan 1-8: Full work on Katana (8-10h/week)"
        - "Jan 9-31: Continue Katana + start 002 Карты (6-8h/week)"
        - "Feb 1-8: Maximum productivity before surgery"
        - "Feb 9-19: Medical preparation (no work)"
        - "Feb 19-28: Post-surgery, no work"
        - "Mar 1-31: Recovery mode, 50% capacity, light support only"
      medical_events:
        - "02-09: Start medical tests"
        - "02-19: Surgery (Тонзиллэктомия)"

    Q2_2026:
      focus: "Resume work + launch SaaS MVP + eye surgery"
      goals:
        - "Achieve 50%+ recovery from gland surgery"
        - "Stabilize Katana (verify it works, is generating revenue)"
        - "Plan and start 005 Sales QA"
        - "Complete SMILE eye surgery"
      timeline:
        - "Apr 1-30: Full capacity, intensive SaaS work"
        - "May 1-31: Balanced work (SaaS + light Katana monitoring)"
      medical_events:
        - "Apr: SMILE procedure"
        - "May-Jun: Post-SMILE recovery (minor)"
        - "Jun 30: Tirzepatide target weight achieved"

    Q3_2026:
      focus: "Grow SaaS revenue + prepare for family"
      goals:
        - "Sales QA: Get 5-10 beta users, first paying customers"
        - "Katana: Stable revenue generation"
        - "Accumulate capital for 2029 goals (ипотека + суррогатство)"
        - "Complete all health procedures"

    Q4_2026:
      focus: "Consolidate + plan 2027"
      goals:
        - "Sales QA: 20+ users, $2-5K MRR"
        - "Katana: Passive revenue stream established"
        - "Plan 2027: scale SaaS OR launch Consilium"
        - "Timeline for marriage with Masha"

  financial_target_2026: "$60,000 - $180,000 (passive + SaaS)"

  wip_limit: 2
  wip_detail:
    - slot_1: "001-Katana (core, never pause)"
    - slot_2: "005-Sales-QA (after gland recovery)"
    note: |
      Max 2 projects. All others (002, 004, 007, 003)
      are PAUSED or deprioritized for 2026.

