# ============================================================================
# METADATA & TRACKING
# ============================================================================
metadata:
  # Auto-populated by Life OS system
  created: ""  # ISO 8601: "2026-01-01T00:00:00Z"
  updated: ""  # ISO 8601: Last modification timestamp

  # Review schedule (auto-calculated)
  next_review: ""  # Next scheduled review date

  # Version tracking
  version: "1.0"
  template_version: "1.0"

  # PDCA cycle tracking
  pdca_cycle:
    plan: "Annual goals set"  # P: Plan (this file)
    do: "Weekly execution"     # D: Do (weekly todos)
    check: "Weekly/Monthly/Quarterly reviews"  # C: Check (retrospectives)
    act: "Adjust goals based on learnings"     # A: Act (version updates)

  # Alignment validation
  alignment_checks:
    last_validation: ""  # ISO 8601
    validation_status: "pending"  # pending | passed | failed
    misalignments: []  # List of detected misalignments

  # Progress tracking
  progress:
    weeks_completed: 0
    months_completed: 0
    quarters_completed: 0
    halves_completed: 0
    year_completion_pct: 0

  # Notes and context
  notes: |
    This template represents a full PDCA hierarchy for annual goal management.

    HOW TO USE:
    1. Copy this template to your personal goals file
    2. Fill in YOUR specific goals (replace examples)
    3. Start with annual → half-yearly → quarterly → monthly → weekly
    4. Review weekly (Monday), monthly (1st), quarterly (1st), half-yearly (Jan 1, Jul 1), annual (Jan 1)
    5. Use Life OS workflows to execute and track

    ALIGNMENT RULES:
    - Weekly todos MUST support monthly focus
    - Monthly focus MUST support quarterly goals
    - Quarterly goals MUST support half-yearly milestones
    - Half-yearly milestones MUST support annual vision

    CATEGORIES:
    - Finance: Revenue, profit, savings, investments
    - Business: Products, market, partnerships, operations
    - Health: Physical, mental, energy, medical
    - Personal: Learning, relationships, hobbies, life balance
