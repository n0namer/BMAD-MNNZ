# Life OS Goals Template - Full PDCA Hierarchy
# Version: 1.0
# Purpose: Annual → Half-Yearly → Quarterly → Monthly → Weekly goal cascade
# Tier: 1 (Core)
# Tier Name: Core
# Unlock Requirement: none
# Category: planning
# Difficulty: beginner
# Estimated Time: 30-60 min initial setup, 5-10 min weekly updates
# Description: Annual goal cascade with PDCA tracking across all time horizons
#
# VALIDATION RULES:
# 1. Each lower level MUST align with parent level
# 2. Weekly goals MUST roll up to monthly → quarterly → half-yearly → annual
# 3. All 4 categories (finance, business, health, personal) MUST be filled
# 4. Use specific, measurable outcomes (not vague wishes)
# 5. Review schedule: Weekly (Mon), Monthly (1st), Quarterly (1st), Half-Yearly (Jan 1, Jul 1), Annual (Jan 1)

# ============================================================================
# ANNUAL GOALS (2026) - Top-Level Vision
# ============================================================================
goals:
  year_2026:
    # Financial: Revenue, profit, savings, investments
    finance: |
      Example: Katana SaaS - $120K ARR (10K MRR by Dec)
      Автоответчик - $60K ARR (5K MRR by Dec)
      Total: $180K ARR, 70% profit margin

    # Business: Product launches, market expansion, partnerships
    business: |
      Example: Katana - Launch v2.0 with AI automation (Q2)
      Автоответчик - Expand to 3 new verticals (healthcare, legal, real estate)
      Build strategic partnership with 2 major CRM platforms

    # Health: Physical, mental, energy management
    health: |
      Example: Maintain 90kg weight, 8hr sleep avg, exercise 4x/week
      Stress management: Daily meditation 15min, weekly nature walks
      Annual health checkup with full panel (Q1)

    # Personal: Learning, relationships, hobbies, life balance
    personal: |
      Example: Read 24 books (2/month), learn advanced TypeScript patterns
      Spend quality time with family 2x/week
      Master piano - complete 12 classical pieces

  # ============================================================================
  # HALF-YEARLY GOALS - Strategic Milestones
  # ============================================================================

  h1_2026:  # January - June
    finance: |
      Example: Katana - $50K ARR (4.2K MRR by Jun)
      Автоответчик - $25K ARR (2.1K MRR by Jun)
      H1 Total: $75K ARR

    business: |
      Example: Katana - Complete v2.0 feature set, beta testing
      Автоответчик - Launch in healthcare vertical, 50 pilot customers
      Establish 1 major CRM partnership

    health: |
      Example: Q1-Q2 health routine established and consistent
      Complete annual checkup, address any findings
      Build sustainable exercise habit (consistency >85%)

    personal: |
      Example: Read 12 books (H1), complete TypeScript advanced course
      Establish weekly family routine
      Piano - complete 6 pieces (1 per month)

  h2_2026:  # July - December
    finance: |
      Example: Katana - $120K ARR (10K MRR by Dec), scale from 4.2K
      Автоответчик - $60K ARR (5K MRR by Dec), scale from 2.1K
      H2 Total: $180K ARR

    business: |
      Example: Katana - v2.0 GA launch, onboard 100+ customers
      Автоответчик - Expand to legal and real estate verticals
      Close 2nd CRM partnership

    health: |
      Example: Maintain Q1-Q2 health metrics
      Optimize routines based on H1 learnings
      Prepare annual health goals for 2027

    personal: |
      Example: Read 12 books (H2), master advanced TypeScript patterns
      Deepen family engagement quality
      Piano - complete remaining 6 pieces

  # ============================================================================
  # QUARTERLY GOALS - Execution Phases
  # ============================================================================

  q1_2026:  # January - March
