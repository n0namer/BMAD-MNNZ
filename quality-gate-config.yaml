# Quality Gates Configuration for Sprint 0
# File: quality-gate-config.yaml
# Purpose: Define quality thresholds for CI/CD pipeline

quality_gates:
  # Code Coverage Thresholds
  coverage:
    overall_threshold: 90
    minimum_acceptable: 80
    critical_sections: 95
    modules:
      core:
        threshold: 95
        minimum: 85
      utils:
        threshold: 85
        minimum: 75
      integration:
        threshold: 80
        minimum: 70

  # Linting & Code Style
  lint:
    max_warnings: 0
    max_errors: 0
    ruff_checks:
      - enabled: true
      - strict: true
    black_format:
      enabled: true
      line_length: 100

  # Type Checking
  type_checking:
    max_type_errors: 0
    mypy_strict: true
    required_annotations: true
    ignore_missing_imports: false

  # Security
  security:
    max_security_issues: 0
    max_critical_vulnerabilities: 0
    max_high_vulnerabilities: 1
    max_medium_vulnerabilities: 5
    max_low_vulnerabilities: 10
    bandit_severity: medium
    enable_sarif_upload: true

  # Dependencies
  dependencies:
    max_critical_vulnerabilities: 0
    max_high_vulnerabilities: 0
    max_medium_vulnerabilities: 3
    max_outdated_major: 0
    max_outdated_minor: 2
    audit_frequency: weekly

  # Performance
  performance:
    max_execution_time_seconds: 600
    max_memory_usage_mb: 512
    max_build_time_minutes: 10
    regression_threshold_percent: 10

  # Test Quality
  tests:
    minimum_unit_tests: 1
    minimum_integration_tests: 0
    minimum_test_count: 50
    minimum_assertions_per_test: 2
    max_test_duration_seconds: 30
    test_discovery: true

# Branch Protection Rules
branch_protection:
  main:
    require_status_checks: true
    require_pull_request_reviews: 2
    dismiss_stale_pr_approvals: true
    require_code_owner_reviews: false
    require_status_checks_pass:
      - test-matrix (3.11)
      - test-matrix (3.12)
      - test-matrix (3.13)
      - quality-gates
      - security-checks
      - build-check
    allow_force_pushes: false
    allow_deletions: false
    enforce_admins: true
    restrictions: null

  develop:
    require_status_checks: true
    require_pull_request_reviews: 1
    dismiss_stale_pr_approvals: true
    require_code_owner_reviews: false
    require_status_checks_pass:
      - test-matrix (3.12)
      - quality-gates
      - security-checks
    allow_force_pushes: false
    allow_deletions: false
    enforce_admins: false

# Notification & Reporting
notifications:
  on_failure:
    create_issue: true
    notify_slack: false
    notify_email: false
  on_warning:
    create_github_check: true
    comment_on_pr: true

# Artifact Management
artifacts:
  retention_days:
    test_results: 30
    coverage_reports: 30
    security_reports: 90
    build_artifacts: 7
    performance_data: 90

# Pipeline Configuration
pipeline:
  max_parallel_jobs: 4
  timeout_minutes: 30
  fail_fast: false
  allow_retry: true
  max_retries: 2

# Compliance & Audit
compliance:
  require_commit_signing: false
  require_issue_reference: false
  enforce_conventional_commits: false
  enable_audit_logging: true

# Integration
integrations:
  codecov:
    enabled: true
    fail_on_error: false
    upload_reports: true
  github_security:
    enabled: true
    upload_sarif: true
  github_pages:
    enabled: false
    publish_coverage: false
